<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>WebServ</title>
    <style>
        body { font-family: monospace; max-width: 700px; margin: 40px auto; }
        a { color: #00f; }
        pre { background: #f4f4f4; padding: 10px; }
    </style>
</head>
<body>
    <h1>WebServ - C++ HTTP Server</h1>

    <h2>Tests disponibles</h2>
    <ul>
        <li><a href="/cgi-bin/hello.php">CGI PHP</a></li>
        <li><a href="/files/">Lister les uploads (autoindex)</a></li>
    </ul>

    <h2>Upload (POST)</h2>
    <form action="/uploads" method="POST" enctype="multipart/form-data">
        <input type="file" name="file">
        <input type="submit" value="Envoyer">
    </form>

    <h2>DELETE via curl</h2>
    <pre>curl -X DELETE http://localhost:8080/files/monFichier.txt</pre>
</body>
</html>
